workflows:
  digios-demo:
    name: DigiOS Demo APK
    max_build_duration: 60
    environment:
      flutter: 3.22.3
    scripts:
      - name: Limpar cache e resolver dependências
        script: |
          rm -f pubspec.lock
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
